name: Unit Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  golangci:
    name: Run unit tests
    runs-on: ubuntu-latest
    container: golang:1.23
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -coverprofile=coverage.out ./...

      - name: Show coverage
        run: go tool cover -func=coverage.out